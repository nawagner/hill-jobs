# Daily ingestion runs on Railway (ingest-cron service), not here.
# GitHub disables scheduled workflows after 60 days without repo activity,
# which silently stopped ingestion in August 2026.
name: Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        working-directory: apps/api
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync

      - name: Install Playwright browsers
        working-directory: apps/api
        run: uv run playwright install --with-deps chromium

      - name: Run unit tests
        working-directory: apps/api
        run: uv run pytest tests/ -v --ignore=tests/ingest/test_live_scrape.py

      - name: Run live scrape tests
        working-directory: apps/api
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CSOD_DEBUG_DIR: ${{ github.workspace }}/csod-debug
        run: uv run pytest tests/ingest/test_live_scrape.py -v -m live

      - name: Upload CSOD debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csod-debug
          path: csod-debug/
          if-no-files-found: ignore
